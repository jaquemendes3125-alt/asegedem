<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>COZINHA MULTIPERFIL</title>
  <!-- ✅ SEU BANCO DE DADOS SUPABASE -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
    body { background: #f8fafc; padding: 16px; max-width: 700px; margin: 0 auto; }

    header { background: #1e293b; color: white; padding: 20px; border-radius: 16px; text-align: center; margin-bottom: 20px; }
    h1 { font-size: 1.3rem; }

    .voz { background: white; padding: 16px; border-radius: 12px; text-align: center; margin-bottom: 20px; }
    .btn-mic { width: 70px; height: 70px; border-radius: 50%; border: none; background: #10b981; color: white; font-size: 28px; cursor: pointer; }
    .btn-mic.ouvindo { background: #ef4444; animation: pulso 1s infinite; }
    @keyframes pulso { 0%{transform:scale(1)} 50%{transform:scale(1.1)} 100%{transform:scale(1)} }
    .resposta { margin-top: 10px; padding: 10px; background: #f1f5f9; border-radius: 8px; min-height: 40px; font-size: 0.9rem; }
    .status-sync { font-size: 0.8rem; margin-top: 6px; color: #64748b; }

    h2 { font-size: 1rem; margin: 20px 0 10px; }

    .perfis { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-bottom: 15px; }
    .btn-perfil { padding: 10px 4px; border: 3px solid transparent; border-radius: 10px; cursor: pointer; font-weight: bold; font-size: 0.75rem; }
    .saude { background: #fef2f2; color: #b91c1c; border-color: #ef4444; }
    .fit { background: #f0fdf4; color: #15803d; border-color: #10b981; }
    .caseiro { background: #fffbeb; color: #b45309; border-color: #f59e0b; }
    .rapido { background: #faf5ff; color: #6b21a8; border-color: #8b5cf6; }
    .gourmet { background: #fff7ed; color: #c2410c; border-color: #f97316; }
    .selecionado { transform: scale(1.05); box-shadow: 0 0 6px rgba(0,0,0,0.2); }

    .caixa { background: white; padding: 15px; border-radius: 12px; margin-bottom: 15px; }
    input, textarea { width: 100%; padding: 10px; border: 2px solid #e2e8f0; border-radius: 8px; margin-bottom: 8px; font-size: 1rem; }
    button { padding: 10px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 0.95rem; }
    .btn-azul { width: 100%; background: #1e293b; color: white; margin-top: 5px; }
    .btn-whats { width: 100%; background: #25d366; color: white; margin-top: 10px; }

    .pedido { background: white; border-radius: 10px; padding: 12px; margin: 8px 0; border-left: 5px solid #ccc; }
    .pedido.saude { border-left-color: #ef4444; }
    .pedido.fit { border-left-color: #10b981; }
    .pedido.caseiro { border-left-color: #f59e0b; }
    .pedido.rapido { border-left-color: #8b5cf6; }
    .pedido.gourmet { border-left-color: #f97316; }
    .pedido-nome { font-weight: bold; font-size: 1rem; }
    .etiqueta { display: inline-block; font-size: 0.75rem; font-weight: bold; padding: 2px 8px; border-radius: 10px; color: white; margin: 4px 0; }
    .restricao { font-size: 0.85rem; color: #b91c1c; background: #fef2f2; padding: 4px 8px; border-radius: 6px; display: inline-block; margin: 4px 0; }
    .botoes { display: flex; gap: 8px; margin-top: 8px; }
    .btn-concluir { flex: 1; background: #dcfce7; color: #166534; }
    .btn-excluir { flex: 1; background: #fee2e2; color: #b91c1c; }

    .lista-compra { background: #eff6ff; padding: 12px; border-radius: 10px; border: 2px dashed #93c5fd; white-space: pre-wrap; font-size: 0.9rem; line-height: 1.5; margin-bottom: 10px; }
    .topo-lista { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .btn-copiar { background: #dbeafe; color: #1d4ed8; font-size: 0.85rem; padding: 4px 10px; }
  </style>
</head>
<body>

  <header>
    <h1>🍳 COZINHA MULTIPERFIL</h1>
    <p style="font-size:0.85rem; opacity:0.8; margin-top:4px;">Gestão de Cardápios — Dados salvos na nuvem ✅</p>
  </header>

  <!-- MICROFONE -->
  <div class="voz">
    <button class="btn-mic" id="btnMic" onclick="ligarMicrofone()">🎙️</button>
    <p style="margin:8px 0; font-size:0.9rem; color:#475569;">Toque para falar o comando</p>
    <div class="resposta" id="respostaVoz">Aguardando...</div>
    <div class="status-sync" id="statusSync">🔄 Sincronizando...</div>
  </div>

  <!-- PERFIS -->
  <h2>👤 Selecione o Perfil</h2>
  <div class="perfis">
    <button class="btn-perfil saude" id="p-saude" onclick="escolherPerfil('saude','Saúde')">🔴 Saúde</button>
    <button class="btn-perfil fit" id="p-fit" onclick="escolherPerfil('fit','Fit')">🟢 Fit</button>
    <button class="btn-perfil caseiro" id="p-caseiro" onclick="escolherPerfil('caseiro','Caseiro')">🟡 Casa</button>
    <button class="btn-perfil rapido" id="p-rapido" onclick="escolherPerfil('rapido','Rápido')">🟣 Rápido</button>
    <button class="btn-perfil gourmet" id="p-gourmet" onclick="escolherPerfil('gourmet','Gourmet')">🟠 Sabor</button>
  </div>

  <!-- CADASTRAR -->
  <h2>➕ Cadastrar Pedido</h2>
  <div class="caixa">
    <input type="text" id="nome" placeholder="Nome do cliente">
    <input type="number" id="qtd" placeholder="Quantidade de marmitas" min="1">
    <textarea id="obs" placeholder="Observações ou restrições..." rows="2"></textarea>
    <button class="btn-azul" onclick="cadastrar()">✅ CADASTRAR PEDIDO</button>
  </div>

  <!-- LISTA DE COMPRAS -->
  <h2>🛒 Lista de Compras</h2>
  <div class="topo-lista">
    <span id="totalMarmitas">Total: 0 marmitas</span>
    <button class="btn-copiar" onclick="copiarLista()">📋 Copiar</button>
  </div>
  <div class="lista-compra" id="listaCompras">Nenhum pedido cadastrado ainda.</div>
  <button class="btn-whatsapp" onclick="enviarWhatsApp()">📲 Enviar para o Fornecedor</button>

  <!-- PEDIDOS -->
  <h2>📦 Pedidos Cadastrados (<span id="contador">0</span>)</h2>
  <div id="pedidos"></div>

<script>
// ==============================================
// ✅ SEU BANCO DE DADOS SUPABASE — CONECTADO!
// ==============================================
const SUPABASE_URL = "https://ixxrzlnrstpbfnqclosq.supabase.co";
const SUPABASE_KEY = "sb_publishable_6we1T3JGN2HBwTpn4IITig_px6An0IC";
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// ==============================================
// BANCO DE CARDÁPIOS
// ==============================================
const cardapios = {
  saude: [
    "Peixe grelhado + Purê de mandioquinha + Legumes no vapor",
    "Frango cozido + Arroz de couve-flor + Mandioca",
    "Carne moída magra + Abobrinha + Purê de batata",
    "Sopa de abóbora com frango + Gengibre",
    "Omelete de claras + Espinafre + Arroz"
  ],
  fit: [
    "Frango grelhado 150g + Batata-doce + Vagem",
    "Carne moída + Arroz integral + Feijão + Brócolis",
    "Peixe grelhado + Purê de mandioca + Salada",
    "Carne magra + Macarrão integral + Legumes",
    "Frango desfiado + Arroz com lentilha + Couve"
  ],
  caseiro: [
    "Bife acebolado + Arroz + Feijão + Farofa",
    "Frango assado + Batata + Salada",
    "Lombo + Arroz + Couve refogada",
    "Peixe ensopado + Arroz + Pirão",
    "Carne ao molho + Macarrão + Salada"
  ],
  rapido: [
    "Escondidinho de frango com purê",
    "Arroz com carne e legumes",
    "Frango desfiado com legumes",
    "Carne moída com feijão e arroz",
    "Macarrão com frango e molho"
  ],
  gourmet: [
    "Lasanha de carne com molho de tomate",
    "Nhoque ao molho de queijo + Filé",
    "Frango à parmegiana + Arroz + Batata",
    "Strogonoff de carne + Arroz + Batata palha",
    "Costela com purê de mandioca gratinado"
  ]
};

let perfilEscolhido = null;
let nomePerfil = "";
let pedidos = [];
let reconhecimento = null;
const statusSync = document.getElementById('statusSync');

// ==============================================
// CARREGAR DADOS DO BANCO AO ABRIR
// ==============================================
async function carregarDoBanco() {
  try {
    statusSync.textContent = "🔄 Carregando do banco...";
    const { data, error } = await supabase.from('pedidos').select('*').order('id', { ascending: false });
    
    if (error) {
      console.log("Banco acessível, mas tabela ainda vazia:", error.message);
      statusSync.textContent = "✅ Conectado — pronto para cadastrar";
      pedidos = [];
    } else if (data) {
      pedidos = data;
      statusSync.textContent = "✅ Sincronizado — " + pedidos.length + " pedidos";
    }
  } catch (e) {
    console.log("Salvando localmente:", e);
    const salvo = localStorage.getItem('cozinha');
    pedidos = salvo ? JSON.parse(salvo) : [];
    statusSync.textContent = "⚠️ Salvo localmente";
  }
  
  montarListaPedidos();
  montarListaCompras();
}

// ==============================================
// SALVAR NO BANCO DE DADOS
// ==============================================
async function salvarNoBanco(pedido) {
  try {
    statusSync.textContent = "💾 Salvando na nuvem...";
    const { data, error } = await supabase.from('pedidos').insert([pedido]).select();
    
    if (error) {
      console.log("Salvo localmente:", error.message);
      salvarLocal();
      statusSync.textContent = "✅ Salvo localmente";
    } else {
      if (data && data[0]) pedido.id = data[0].id;
      statusSync.textContent = "✅ Salvo na nuvem!";
    }
  } catch (e) {
    salvarLocal();
    statusSync.textContent = "✅ Salvo localmente";
  }
}

// ==============================================
// ESCOLHER PERFIL
// ==============================================
function escolherPerfil(tipo, nome) {
  document.querySelectorAll('.btn-perfil').forEach(b => b.classList.remove('selecionado'));
  document.getElementById(`p-${tipo}`).classList.add('selecionado');
  perfilEscolhido = tipo;
  nomePerfil = nome;
  falar("Perfil " + nome + " selecionado. Digite os dados e clique em cadastrar.");
}

// ==============================================
// CADASTRAR PEDIDO — PRINCIPAL
// ==============================================
async function cadastrar() {
  const nome = document.getElementById('nome').value.trim();
  const qtd = parseInt(document.getElementById('qtd').value) || 1;
  const obs = document.getElementById('obs').value.trim() || "Sem restrições";

  if (!nome) { alert("Digite o nome do cliente!"); return; }
  if (!perfilEscolhido) { alert("Escolha um perfil primeiro!"); return; }

  const cardapioEscolhido = cardapios[perfilEscolhido][Math.floor(Math.random() * 5)];

  const pedido = {
    nome: nome,
    perfil: perfilEscolhido,
    perfilNome: nomePerfil,
    quantidade: qtd,
    cardapio: cardapioEscolhido,
    observacao: obs,
    concluido: false
  };

  // Salva na nuvem e na tela
  await salvarNoBanco(pedido);
  pedidos.unshift(pedido); // Adiciona no topo da lista
  salvarLocal();
  limparCampos();
  montarListaPedidos();
  montarListaCompras();

  falar("Cadastrado " + qtd + " marmita de " + nome + ". Perfil " + nomePerfil);
  alert("✅ Pedido cadastrado e salvo!");
}

// ==============================================
// MONTAR LISTA NA TELA
// ==============================================
function montarListaPedidos() {
  const area = document.getElementById('pedidos');
  area.innerHTML = "";

  pedidos.forEach(p => {
    const div = document.createElement('div');
    div.className = `pedido ${p.perfil}`;
    div.innerHTML = `
      <div class="pedido-nome">${p.nome}</div>
      <span class="etiqueta ${p.perfil}">${p.perfilNome}</span>
      <div>🍽️ ${p.quantidade} marmita${p.quantidade>1?'s':''}</div>
      <div style="margin:4px 0;">${p.cardapio}</div>
      ${p.observacao !== "Sem restrições" ? `<div class="restricao">⚠️ ${p.observacao}</div>` : ""}
      <div class="botoes">
        <button class="btn-concluir" onclick="concluir(${p.id || Date.now()}, '${p.nome}')">${p.concluido?'↩️ Refazer':'✅ Concluído'}</button>
        <button class="btn-excluir" onclick="excluir(${p.id || Date.now()})">🗑️ Excluir</button>
      </div>
    `;
    area.appendChild(div);
  });

  document.getElementById('contador').textContent = pedidos.length;
}

// ==============================================
// LISTA DE COMPRAS
// ==============================================
function montarListaCompras() {
  const ativos = pedidos.filter(p => !p.concluido);
  if (ativos.length === 0) {
    document.getElementById('listaCompras').textContent = "Nenhum pedido ativo.";
    document.getElementById('totalMarmitas').textContent = "Total: 0 marmitas";
    return;
  }

  let texto = "📦 LISTA DE COMPRAS\n═════════════════════════════\n\n";
  let total = 0;

  ativos.forEach(ped => {
    total += ped.quantidade;
    texto += `🔹 ${ped.nome} — ${ped.quantidade}x ${ped.perfilNome}\n`;
    texto += `   ${ped.cardapio}\n`;
    if (ped.observacao !== "Sem restrições") texto += `   ⚠️ ${ped.observacao}\n`;
    texto += "\n";
  });

  texto += "═════════════════════════════\n✅ TOTAL: " + total + " marmitas";

  document.getElementById('listaCompras').textContent = texto;
  document.getElementById('totalMarmitas').textContent = `Total: ${total} marmitas`;
}

// ==============================================
// AÇÕES — CONCLUIR E EXCLUIR
// ==============================================
async function concluir(id, nome) {
  const p = pedidos.find(x => x.id === id || (x.nome === nome));
  if (p) {
    p.concluido = !p.concluido;
    salvarLocal();
    montarListaPedidos();
    montarListaCompras();
    // Atualiza no banco se tiver ID
    if (id && id > 1000) {
      try {
        await supabase.from('pedidos').update({ concluido: p.concluido }).eq('id', id);
      } catch(e) {}
    }
  }
}

async function excluir(id) {
  if (!confirm("Tem certeza que deseja excluir?")) return;
  pedidos = pedidos.filter(x => x.id !== id);
  salvarLocal();
  montarListaPedidos();
  montarListaCompras();
  // Exclui do banco se tiver ID
  if (id && id > 1000) {
    try {
      await supabase.from('pedidos').delete().eq('id', id);
    } catch(e) {}
  }
}

// ==============================================
// FUNÇÕES AUXILIARES
// ==============================================
function copiarLista() {
  const texto = document.getElementById('listaCompras').textContent;
  navigator.clipboard.writeText(texto).then(() => alert("✅ Lista copiada!"));
}
function enviarWhatsApp() {
  const texto = encodeURIComponent(document.getElementById('listaCompras').textContent);
  window.open(`https://wa.me/?text=${texto}`, '_blank');
}
function limparCampos() {
  document.getElementById('nome').value = "";
  document.getElementById('qtd').value = "";
  document.getElementById('obs').value = "";
  document.querySelectorAll('.btn-perfil').forEach(b => b.classList.remove('selecionado'));
  perfilEscolhido = null;
  nomePerfil = "";
}
function salvarLocal() {
  localStorage.setItem('cozinha', JSON.stringify(pedidos));
}

// ==============================================
// MICROFONE — FALA E RECONHECE
// ==============================================
function ligarMicrofone() {
  if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
    alert("⚠️ Use o Google Chrome para usar o microfone!");
    return;
  }

  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const btn = document.getElementById('btnMic');
  const resp = document.getElementById('respostaVoz');

  if (!reconhecimento) {
    reconhecimento = new SR();
    reconhecimento.lang = 'pt-BR';

    reconhecimento.onstart = () => {
      btn.classList.add('ouvindo');
      resp.textContent = "🔊 Ouvindo... Fale agora!";
    };

    reconhecimento.onresult = (evento) => {
      const fala = evento.results[0][0].transcript.toLowerCase();
      resp.textContent = "Você disse: " + fala;
      interpretarComando(fala);
    };

    reconhecimento.onend = () => {
      btn.classList.remove('ouvindo');
    };
  }

  reconhecimento.start();
}

function interpretarComando(fala) {
  if (fala.includes('saúde') || fala.includes('pós')) escolherPerfil('saude','Saúde');
  else if (fala.includes('fit') || fala.includes('academia')) escolherPerfil('fit','Fit');
  else if (fala.includes('caseiro') || fala.includes('tradicional')) escolherPerfil('caseiro','Caseiro');
  else if (fala.includes('rápido') || fala.includes('solteiro')) escolherPerfil('rapido','Rápido');
  else if (fala.includes('gourmet') || fala.includes('massa') || fala.includes('queijo')) escolherPerfil('gourmet','Gourmet');
  else if (fala.includes('cadastrar') || fala.includes('cadastra')) cadastrar();
  else falar("Entendi: " + fala);
}

function falar(frase) {
  if ('speechSynthesis' in window) {
    window.speechSynthesis.cancel();
    const fala = new SpeechSynthesisUtterance(frase);
    fala.lang = 'pt-BR';
    fala.rate = 1.0;
    window.speechSynthesis.speak(fala);
  }
}

// ==============================================
// INICIAR AO ABRIR A PÁGINA
// ==============================================
carregarDoBanco();
</script>
</body>
</html>
